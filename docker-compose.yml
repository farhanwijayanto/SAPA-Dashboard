version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sapa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sapa_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://user:password@db/sapa_db
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: sapa
      MONGODB_COLLECTION_ATTENDANCE: attendance_logs
      MONGODB_COLLECTION_AUDIT: audit_logs
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      MQTT_TOPIC_GATE: sapa/gate
      MQTT_TOPIC_ATTENDANCE: sapa/attendance
      MQTT_TOPIC_DEVICE_STATUS: sapa/device/status
      MQTT_TOPIC_DEVICE_HEARTBEAT: sapa/device/heartbeat
      MQTT_TOPIC_PIR: sapa/pir
      IOT_OFFLINE_AFTER_SECONDS: "15"
      EDGE_INGEST_KEY: "dev-edge-ingest-key-for-local-testing"
      SECRET_KEY: supersecretkey
      CORS_ALLOW_ORIGINS: "*"
      # Set SAPA_RUN_SEED=1 the first time you start the stack to seed the
      # admin/manager users. Unset (or set to 0) afterwards so password
      # changes survive container restarts.
      SAPA_RUN_SEED: "1"
      SAPA_ADMIN_PASSWORD: ""
      SAPA_MANAGER_PASSWORD: ""
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mqtt:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
