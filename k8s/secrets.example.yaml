# Template Secret untuk SAPA. JANGAN commit dengan nilai asli.
# Pemakaian:
#   1. Salin file ini menjadi secrets.yaml (sudah masuk .gitignore).
#   2. Isi nilainya, lalu apply: kubectl apply -f k8s/secrets.yaml
# Atau pakai kubectl create secret langsung (contoh ada di docs/SAPA-Kubeadm-Deployment-ID.md).
apiVersion: v1
kind: Secret
metadata:
  name: sapa-db-secret
  namespace: sapa
type: Opaque
stringData:
  POSTGRES_USER: "sapa"
  POSTGRES_PASSWORD: "ganti-password-postgres"
  POSTGRES_DB: "sapa_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: sapa-backend-secret
  namespace: sapa
type: Opaque
stringData:
  # cocokkan dengan sapa-db-secret di atas
  DATABASE_URL: "postgresql://sapa:ganti-password-postgres@sapa-db:5432/sapa_db"
  MONGODB_URI: "mongodb://sapa-mongo:27017"
  SECRET_KEY: "ganti-dengan-openssl-rand-hex-32"
  EDGE_INGEST_KEY: "ganti-dengan-openssl-rand-hex-24"
  # Isi MQTT_USERNAME / MQTT_PASSWORD setelah Mosquitto production diaktifkan.
  MQTT_USERNAME: "backend"
  MQTT_PASSWORD: "ganti-password-mqtt-backend"
  # Optional: password awal untuk seed Job (k8s/seed-job.yaml).
  # Kalau tidak diisi, seed pakai dev default 'admin123' / 'manager123' dan
  # WAJIB diganti via UI sesudah login pertama.
  SAPA_ADMIN_PASSWORD: "ganti-password-admin-awal"
  SAPA_MANAGER_PASSWORD: "ganti-password-manager-awal"
---
# Password file untuk Mosquitto production (lihat k8s/mosquitto-production.yaml).
# Isi 'passwords' dengan output `mosquitto_passwd`. JANGAN simpan plaintext di sini.
apiVersion: v1
kind: Secret
metadata:
  name: sapa-mosquitto-auth
  namespace: sapa
type: Opaque
stringData:
  passwords: |
    backend:$7$101$contoh-hash$xxx
    esp32:$7$101$contoh-hash$xxx
    edge:$7$101$contoh-hash$xxx
