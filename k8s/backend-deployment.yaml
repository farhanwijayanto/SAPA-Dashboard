apiVersion: v1
kind: ConfigMap
metadata:
  name: sapa-backend-config
  namespace: sapa
data:
  MONGODB_DB: "sapa"
  MONGODB_COLLECTION_ATTENDANCE: "attendance_logs"
  MONGODB_COLLECTION_AUDIT: "audit_logs"
  MQTT_BROKER: "sapa-mosquitto"
  MQTT_PORT: "1883"
  MQTT_TOPIC_GATE: "sapa/gate"
  MQTT_TOPIC_ATTENDANCE: "sapa/attendance"
  MQTT_TOPIC_DEVICE_STATUS: "sapa/device/status"
  MQTT_TOPIC_DEVICE_HEARTBEAT: "sapa/device/heartbeat"
  MQTT_TOPIC_PIR: "sapa/pir"
  IOT_OFFLINE_AFTER_SECONDS: "15"
  EDGE_STREAM_URL: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sapa-backend
  namespace: sapa
  labels:
    app: sapa-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sapa-backend
  template:
    metadata:
      labels:
        app: sapa-backend
    spec:
      containers:
        - name: backend
          image: sapa-backend:1.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sapa-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sapa-backend-secret
                  key: DATABASE_URL
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: sapa-backend-secret
                  key: MONGODB_URI
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sapa-backend-secret
                  key: SECRET_KEY
            - name: EDGE_INGEST_KEY
              valueFrom:
                secretKeyRef:
                  name: sapa-backend-secret
                  key: EDGE_INGEST_KEY
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sapa-backend-secret
                  key: MQTT_USERNAME
                  optional: true
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sapa-backend-secret
                  key: MQTT_PASSWORD
                  optional: true
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          volumeMounts:
            - name: uploads
              mountPath: /app/backend/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: sapa-backend-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sapa-backend-uploads
  namespace: sapa
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sapa-backend
  namespace: sapa
spec:
  selector:
    app: sapa-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
