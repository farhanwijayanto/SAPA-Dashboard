apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sapa-mongo-data
  namespace: sapa
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sapa-mongo
  namespace: sapa
  labels:
    app: sapa-mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sapa-mongo
  template:
    metadata:
      labels:
        app: sapa-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.runCommand({ ping: 1 }).ok"
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sapa-mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: sapa-mongo
  namespace: sapa
spec:
  selector:
    app: sapa-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
