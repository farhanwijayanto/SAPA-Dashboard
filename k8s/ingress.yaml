apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sapa-api-ingress
  namespace: sapa
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - host: sapa.example.com
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: sapa-backend
            port:
              number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sapa-frontend-ingress
  namespace: sapa
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: sapa.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sapa-frontend
            port:
              number: 80
